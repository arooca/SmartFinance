services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-smartfinance}
      MYSQL_USER: ${DB_USERNAME:-smartfinance}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - smartfinance-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_ADDRESS: 0.0.0.0
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-smartfinance}
      DB_USERNAME: ${DB_USERNAME:-smartfinance}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_EMAIL_VERIFICATION_REQUIRED: ${REQUIRE_EMAIL_VERIFICATION:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      APP_SECURITY_TRUST_CLOUDFLARE_HEADER: ${APP_SECURITY_TRUST_CLOUDFLARE_HEADER:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      MAIL_FROM: ${MAIL_FROM:-no-reply@smartfinance.local}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  smartfinance-mysql:
