spring.application.name=SmartFinance
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=SmartFinance
info.app.description=Aplicación web de gestión de finanzas personales

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:adrian.aroca1997@gmail.com}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.email-verification.required=${APP_EMAIL_VERIFICATION_REQUIRED:${REQUIRE_EMAIL_VERIFICATION:true}}
app.security.trust-cloudflare-header=${APP_SECURITY_TRUST_CLOUDFLARE_HEADER:false}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:adrian.aroca1997@gmail.com}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}