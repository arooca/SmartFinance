<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cambiar contraseña - SmartFinance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="auth-page"><div class="auth-container"><div class="card auth-card"><div class="card-body">
    <h1 class="h3 mb-3">Cambiar contraseña</h1>
    <div th:if="${invalidToken}" class="alert alert-warning">Este enlace no es válido o ha caducado. Solicita uno nuevo.</div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:if="${invalidToken != true}" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <label for="password" class="form-label">Nueva contraseña</label><input id="password" name="password" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required>
        <label for="confirmPassword" class="form-label mt-3">Repite la contraseña</label><input id="confirmPassword" name="confirmPassword" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required>
        <button class="btn btn-primary w-100 mt-3" type="submit">Guardar contraseña</button>
    </form>
    <a th:href="@{/forgot-password}" class="d-block text-center mt-3">Solicitar otro enlace</a>
</div></div></div></main></body></html>
