<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recuperar contraseña - SmartFinance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="auth-page"><div class="auth-container"><div class="card auth-card"><div class="card-body">
    <h1 class="h3 mb-3">Recuperar contraseña</h1>
    <p class="text-muted">Escribe el correo de tu cuenta y, si está registrado, enviaremos un enlace para cambiar la contraseña.</p>
    <div th:if="${!mailEnabled}" class="alert alert-warning">El correo saliente todavía no está configurado. Añade los datos SMTP en las variables de entorno para activar la recuperación.</div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <form th:action="@{/forgot-password}" method="post"><label for="email" class="form-label">Correo electrónico</label><input id="email" name="email" type="email" class="form-control" autocomplete="email" required><button class="btn btn-primary w-100 mt-3" type="submit">Enviar enlace</button></form>
    <a th:href="@{/login}" class="d-block text-center mt-3">Volver a iniciar sesión</a>
</div></div></div></main></body></html>
