<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header th:fragment="header">

    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm app-navbar">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold text-primary">

                <i class="bi bi-wallet2 me-2"></i>

                SmartFinance

            </span>

            <div class="header-actions">

                <button type="button"
                        class="btn btn-outline-secondary btn-sm theme-toggle"
                        data-theme-toggle
                        aria-label="Activar modo oscuro"
                        title="Activar modo oscuro">
                    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
                    <span class="d-none d-sm-inline" data-theme-label>Modo oscuro</span>
                </button>

                <a class="header-notification position-relative"
                   th:href="@{/notifications}"
                   aria-label="Notificaciones">
                    <i class="bi bi-bell fs-5"></i>
                    <span th:if="${pendingGoalInvitationCount + pendingBudgetNotificationCount > 0}"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          th:text="${pendingGoalInvitationCount + pendingBudgetNotificationCount}">1</span>
                </a>

                <span class="header-user">

                    <i class="bi bi-person-circle me-2"></i>

                    <span class="header-email"
                          sec:authentication="name">
                        Usuario
                    </span>

                </span>

                <form th:action="@{/logout}"
                      method="post">

                    <button type="submit"
                            class="btn btn-outline-danger btn-sm">

                        <i class="bi bi-box-arrow-right me-1"></i>

                        Cerrar sesión

                    </button>

                </form>

            </div>

        </div>

    </nav>

    <div th:if="${successMessage != null or errorMessage != null}"
         class="flash-container" aria-label="Notificaciones" aria-live="polite">
        <div th:if="${successMessage != null}"
             class="flash-message flash-message-success" role="status" data-auto-dismiss="5000">
            <i class="bi bi-check-circle-fill flash-message-icon" aria-hidden="true"></i>
            <span class="flash-message-text" th:text="${successMessage}"></span>
            <button type="button" class="flash-dismiss" data-dismiss-flash aria-label="Cerrar aviso">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
        </div>
        <div th:if="${errorMessage != null}"
             class="flash-message flash-message-error" role="alert" data-auto-dismiss="5000">
            <i class="bi bi-exclamation-circle-fill flash-message-icon" aria-hidden="true"></i>
            <span class="flash-message-text" th:text="${errorMessage}"></span>
            <button type="button" class="flash-dismiss" data-dismiss-flash aria-label="Cerrar aviso">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/flash-messages.js}"></script>

</header>

</body>

</html>
