<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación pendiente - SmartFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-page">
    <div class="auth-container">
        <div class="card auth-card">
            <div class="card-body">
                <h1 class="h3 mb-3">Tu cuenta está creada</h1>
                <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-warning" role="status" th:text="${errorMessage}"></div>
                <p class="text-muted">Para iniciar sesión, confirma tu correo desde el enlace que te enviaremos. Si tarda o no lo encuentras, puedes pedir que lo enviemos de nuevo.</p>
                <form th:action="@{/verification/resend}" method="post">
                    <label for="pendingEmail" class="form-label">Correo de la cuenta</label>
                    <div class="input-group">
                        <input id="pendingEmail" name="email" type="email" class="form-control" autocomplete="email" required th:value="${pendingEmail}">
                        <button class="btn btn-outline-primary" type="submit">Reenviar correo</button>
                    </div>
                </form>
                <a th:href="@{/login}" class="d-block text-center mt-3">Volver a iniciar sesión</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
