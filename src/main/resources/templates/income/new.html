<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartFinance</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

        <div class="form-page">

            <div class="mb-4">

                <h1 th:text="${income.id == null ? 'Nuevo ingreso' : 'Editar ingreso'}">
                    Nuevo ingreso
                </h1>

                <p class="text-muted mb-0">

                    Registra un nuevo ingreso.

                </p>

            </div>

            <div class="card form-card">

                <div class="card-body">

                    <form th:action="@{/income/save}"
                          th:object="${income}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label for="concept"
                                       class="form-label">
                                    Concepto
                                </label>

                                <input type="text"
                                       id="concept"
                                       class="form-control"
                                       th:field="*{concept}"
                                       placeholder="Ej. Nómina">

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('concept')}"
                                     th:errors="*{concept}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-4">

                                <label for="amount"
                                       class="form-label">
                                    Cantidad (€)
                                </label>

                                <input type="number"
                                       id="amount"
                                       step="0.01"
                                       min="0.01"
                                       class="form-control"
                                       th:field="*{amount}"
                                       placeholder="0.00">

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('amount')}"
                                     th:errors="*{amount}">
                                </div>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label for="category"
                                       class="form-label">
                                    Categoría
                                </label>

                                <select class="form-select category-select"
                                        id="category"
                                        data-category-type="INCOME"
                                        th:field="*{category}">

                                    <option value="">
                                        Seleccionar
                                    </option>

                                    <option th:each="category : ${categories}"
                                            th:value="${category.name}"
                                            th:text="${category.name}"></option>

                                    <option value="__add_category__">＋ Añadir categoría personalizada</option>

                                </select>

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('category')}"
                                     th:errors="*{category}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-4">

                                <label for="date"
                                       class="form-label">
                                    Fecha
                                </label>

                                <input type="date"
                                       class="form-control"
                                       id="date"
                                       name="date"
                                       th:value="${income.date != null ? #temporals.format(income.date, 'yyyy-MM-dd') : ''}">

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('date')}"
                                     th:errors="*{date}">
                                </div>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="description"
                                   class="form-label">
                                Descripción
                            </label>

                            <textarea class="form-control"
                                      id="description"
                                      th:field="*{description}"
                                      rows="3"
                                      maxlength="500"
                                      placeholder="Añade una descripción opcional"></textarea>

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}">
                            </div>

                        </div>

                        <div class="form-actions">

                            <button type="button"
                                    onclick="history.back()"
                                    class="btn btn-outline-secondary">

                                Cancelar

                            </button>

                            <button type="submit"
                                    class="btn btn-primary">

                                Guardar ingreso

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/category-select.js"></script>

</body>

</html>
