<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${editing ? 'Editar recurrente - SmartFinance' : 'Nuevo recurrente - SmartFinance'}">
        Nuevo recurrente - SmartFinance
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

        <div class="form-page">

            <div class="mb-4">

                <h1 th:text="${editing ? 'Editar movimiento recurrente' : 'Nuevo movimiento recurrente'}">

                    Nuevo movimiento recurrente

                </h1>

                <p class="text-muted">

                    SmartFinance creará automáticamente el movimiento cada mes.

                </p>

            </div>

            <div class="card form-card">

                <div class="card-body">

                    <form th:action="@{/recurring/save}"
                          th:object="${recurringMovement}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <input type="hidden"
                               th:field="*{active}">

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label for="concept"
                                       class="form-label">

                                    Concepto

                                </label>

                                <input type="text"
                                       id="concept"
                                       class="form-control"
                                       th:field="*{concept}"
                                       placeholder="Ej. Nómina">

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('concept')}"
                                     th:errors="*{concept}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-4">

                                <label for="amount"
                                       class="form-label">

                                    Cantidad (€)

                                </label>

                                <input type="number"
                                       id="amount"
                                       step="0.01"
                                       min="0.01"
                                       class="form-control"
                                       th:field="*{amount}"
                                       placeholder="0.00">

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('amount')}"
                                     th:errors="*{amount}">
                                </div>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-4 mb-4">

                                <label for="type"
                                       class="form-label">

                                    Tipo

                                </label>

                                <select id="type"
                                        class="form-select"
                                        th:field="*{type}">

                                    <option value="EXPENSE">
                                        Gasto
                                    </option>

                                    <option value="INCOME">
                                        Ingreso
                                    </option>

                                </select>

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('type')}"
                                     th:errors="*{type}">
                                </div>

                            </div>

                            <div class="col-md-4 mb-4">

                                <label for="category"
                                       class="form-label">

                                    Categoría

                                </label>

                                <select id="category"
                                        class="form-select category-select"
                                        th:field="*{category}">

                                    <option value="">
                                        Seleccionar
                                    </option>

                                    <option th:each="category : ${incomeCategories}"
                                            th:value="${category.name}"
                                            th:text="${category.name}"
                                            data-type="INCOME"></option>

                                    <option th:each="category : ${expenseCategories}"
                                            th:value="${category.name}"
                                            th:text="${category.name}"
                                            data-type="EXPENSE"></option>

                                    <option value="__add_category__">＋ Añadir categoría personalizada</option>

                                </select>

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('category')}"
                                     th:errors="*{category}">
                                </div>

                            </div>

                            <div class="col-md-4 mb-4">

                                <label for="dayOfMonth"
                                       class="form-label">

                                    Día de cada mes

                                </label>

                                <input type="number"
                                       id="dayOfMonth"
                                       class="form-control"
                                       th:field="*{dayOfMonth}"
                                       min="1"
                                       max="31"
                                       placeholder="1 - 31">

                                <div class="form-text">

                                    Si eliges el día 31, en meses más cortos
                                    se utilizará el último día del mes.

                                </div>

                                <div class="text-danger small mt-1"
                                     th:if="${#fields.hasErrors('dayOfMonth')}"
                                     th:errors="*{dayOfMonth}">
                                </div>

                            </div>

                        </div>

                        <div class="alert alert-info">

                            <i class="bi bi-info-circle me-2"></i>

                            La primera ejecución se programará para la próxima
                            fecha disponible según el día indicado.

                        </div>

                        <div class="form-actions">

                            <a th:href="@{/recurring}"
                               class="btn btn-outline-secondary">

                                Cancelar

                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-check-lg me-1"></i>

                                Guardar recurrente

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/category-select.js"></script>

<script>
    const typeSelect = document.getElementById('type');
    const categorySelect = document.getElementById('category');

    function updateCategories() {

        const selectedType = typeSelect.value;
        const currentValue = categorySelect.value;

        let currentValueIsValid = false;

        Array.from(categorySelect.options).forEach(option => {

            if (!option.dataset.type) {
                option.hidden = false;
                return;
            }

            const matchesType =
                option.dataset.type === selectedType;

            option.hidden = !matchesType;

            if (matchesType && option.value === currentValue) {
                currentValueIsValid = true;
            }

        });

        if (!currentValueIsValid && currentValue !== '') {
            categorySelect.value = '';
        }

    }

    typeSelect.addEventListener('change', updateCategories);

    updateCategories();

</script>

</body>

</html>
