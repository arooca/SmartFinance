<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - SmartFinance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<button type="button" class="btn btn-outline-secondary btn-sm theme-toggle auth-theme-toggle"
        data-theme-toggle aria-label="Activar modo oscuro" title="Activar modo oscuro">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
    <span data-theme-label>Modo oscuro</span>
</button>

<div class="auth-page">

    <div class="auth-container auth-register">

        <div class="card auth-card">

            <div class="card-body">

                <div class="text-center mb-4">

                    <h1 class="h3 auth-brand">
                        <i class="bi bi-wallet2 me-2"></i>
                        Crear cuenta
                    </h1>

                    <p class="text-muted auth-subtitle">
                        Empieza a gestionar tus finanzas
                    </p>

                </div>

                <form th:action="@{/register}"
                      th:object="${registerForm}"
                      method="post">

                    <div class="mb-3">

                        <label for="name"
                               class="form-label">
                            Nombre
                        </label>

                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               class="form-control"
                               autocomplete="name"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label for="email"
                               class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               autocomplete="email"
                               required>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <div class="mb-4">

                        <label for="password"
                               class="form-label">
                            Contraseña
                        </label>

                        <input type="password"
                               id="password"
                               th:field="*{password}"
                               class="form-control"
                               autocomplete="new-password"
                               minlength="8"
                               maxlength="72"
                               required>

                        <div class="form-text">
                            Debe tener entre 8 y 72 caracteres.
                        </div>

                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}">
                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">

                        <i class="bi bi-person-plus me-1"></i>
                        Crear cuenta

                    </button>

                </form>

                <div class="text-center mt-4">

                    <span class="text-muted">
                        ¿Ya tienes una cuenta?
                    </span>

                    <a th:href="@{/login}"
                       class="auth-link ms-1">
                        Iniciar sesión
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script th:src="@{/js/theme.js}" defer></script>

</body>

</html>
